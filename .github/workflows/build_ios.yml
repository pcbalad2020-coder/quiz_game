name: Build IPA for 3uTools

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          architecture: x64

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter Clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Remove CocoaPods cache
        run: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Update iOS Deployment Target
        run: |
          # تحديث الحد الأدنى للإصدار إلى iOS 12.0
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/' ios/Runner.xcodeproj/project.pbxproj
          
          # تحديث Podfile
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '12.0'/" ios/Podfile
          fi

      - name: Remove SceneDelegate.swift references
        run: |
          # حذف ملف SceneDelegate.swift إذا كان موجوداً
          if [ -f ios/Runner/SceneDelegate.swift ]; then
            rm ios/Runner/SceneDelegate.swift
            echo "SceneDelegate.swift deleted"
          fi
          
          # حذف أي مراجع لـ SceneDelegate في project.pbxproj
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i '' '/SceneDelegate\.swift/d' ios/Runner.xcodeproj/project.pbxproj
            echo "SceneDelegate references removed from project.pbxproj"
          fi

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-flutter-app-ipa
          path: app.ipa